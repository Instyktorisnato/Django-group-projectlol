{% extends "main.html" %}
{% block content %}
  <h2>Подтвердите код(консоль чееек)</h2>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="uid" value="{{ uid }}">
    <label>Код (6 цифр): <input name="code" value="{{ code }}" required></label><br><br>
    <button type="submit">Подтвердить код(как ввел нажми)</button>
  </form>
{% endblock %}
